<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SimpleLAB — Slush Mix Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>SimpleLAB</h1>
    <p class="sub">Quick, reliable slush mix math — oz only.</p>
  </header>

  <!-- Results -->
  <section class="results" id="results">
    <div class="result-card">
      <div class="label">Mixer</div>
      <div class="value" id="out-mixer">—</div>
      <div class="unit">oz</div>
    </div>
    <div class="result-card">
      <div class="label">Water</div>
      <div class="value" id="out-water">—</div>
      <div class="unit">oz</div>
    </div>
    <div class="result-card">
      <div class="label">Liquor</div>
      <div class="value" id="out-liquor">—</div>
      <div class="unit">oz</div>
    </div>
  </section>

  <!-- Warnings -->
  <section class="warnings" id="warnings" hidden></section>

  <!-- Form -->
  <main class="container">
    <form id="slush-form" novalidate>
      <div class="field">
        <label for="batch">Batch size (oz)</label>
        <input id="batch" name="batch" type="number" inputmode="decimal" step="0.5" min="0" placeholder="e.g., 64" required />
      </div>

      <div class="row">
        <div class="field half">
          <label for="serving">Label serving size (oz)</label>
          <input id="serving" name="serving" type="number" inputmode="decimal" step="0.1" min="0" placeholder="e.g., 4" required />
        </div>
        <div class="field half">
          <label for="sugar">Sugar per serving (g)</label>
          <input id="sugar" name="sugar" type="number" inputmode="decimal" step="0.1" min="0" placeholder="e.g., 28" required />
        </div>
      </div>

      <div class="switch">
        <input id="hasLiquor" type="checkbox" />
        <label for="hasLiquor">Include liquor</label>
      </div>

      <div class="field" id="abv-field">
        <label for="abv">Liquor ABV (%)</label>
        <input id="abv" name="abv" type="number" inputmode="decimal" step="1" min="1" max="96" placeholder="40" value="40" />
      </div>

      <div class="buttons">
        <button type="submit" class="cta">Calculate Slush</button>
        <button type="button" id="resetBtn" class="btn-secondary">Reset</button>
      </div>

      <p class="hint">Mix thoroughly before freezing to prevent clumps.</p>
      <p class="footnote">
        This minimal web version mirrors SimpleLAB math and warnings only (no °Brix/ABV display, no Rescue features).
      </p>
    </form>
  </main>

  <!-- Scripts (engine first, then UI) -->
  <script src="lib/simplelab.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
