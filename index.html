<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>simpleLAB LITE — Slush Mix Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <style>
    :root {
      --bg:#ffffff; --fg:#0f172a; --muted:#64748b; --accent:#0ea5e9; --border:#e2e8f0; --card:#f8fafc;
      --grad: linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6,#f59e0b,#10b981);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font:16px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg)}

    .app-header{padding:16px 16px 8px;text-align:center}
    .app-header h1{
      margin:0;font-size:24px;font-weight:800;letter-spacing:.2px;
      background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      animation: pan 12s linear infinite;
    }
    .app-header .sub{margin:6px 0 0;font-size:13px;color:var(--muted)}
    .accent-bar{height:3px;width:100%;background:var(--grad);background-size:200% 100%;animation: pan 12s linear infinite}
    @keyframes pan { to { background-position: 200% 0; } }

    .unit-toggle{display:flex;justify-content:center;gap:8px;padding:10px}
    .unit-label{font-size:13px;color:var(--muted)}
    .segmented{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:#fff}
    .segmented button{border:0;background:#fff;padding:6px 14px;font-size:14px;cursor:pointer}
    .segmented button.on{color:#fff;background:var(--grad);background-size:200% 100%;animation: pan 12s linear infinite}

    .results{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--border)}
    .result-card{
      border-radius:14px;padding:10px;text-align:center;
      background: linear-gradient(#fff,#fff) padding-box, var(--grad) border-box;
      border:1px solid transparent;
    }
    .result-card .label{font-size:12px;color:var(--muted)}
    .result-card .value{font-size:22px;font-weight:800}
    .result-card .unit{font-size:12px;color:var(--muted)}

    .warnings{max-width:640px;margin:10px auto;padding:0 12px}
    .warnings .item{background:#fff8eb;border:1px solid #fde68a;color:#854d0e;border-radius:10px;padding:10px;margin-bottom:6px;font-size:14px}

    .container{max-width:640px;margin:0 auto;padding:12px}
    .field{display:flex;flex-direction:column;margin-bottom:12px}
    .field label{font-size:13px;color:var(--muted);margin-bottom:4px}
    .field input{padding:12px;border:1px solid var(--border);border-radius:12px;font-size:16px}

    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .switch{display:flex;align-items:center;gap:8px;margin:8px 0}

    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .cta{
      border:0;padding:14px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;color:#fff;
      background:var(--grad);background-size:200% 100%;animation: pan 12s linear infinite;
    }
    .btn-secondary{border:1px solid var(--border);background:#fff;padding:14px;border-radius:12px;font-size:16px;cursor:pointer}
  </style>
</head>
<body>
  <header class="app-header">
    <h1>simpleLAB LITE</h1>
    <p class="sub">Inputs & outputs toggle oz ⇄ mL. Sugar stays in grams.</p>
    <p class="sub" id="rangeNote">Batch size: 16–96 oz</p>
  </header>
  <div class="accent-bar" aria-hidden="true"></div>

  <!-- Units toggle -->
  <section class="unit-toggle" aria-label="Output units">
    <span class="unit-label">Units</span>
    <div class="segmented" role="tablist">
      <button type="button" id="u-oz" class="on" role="tab" aria-selected="true">oz</button>
      <button type="button" id="u-ml" role="tab" aria-selected="false">mL</button>
    </div>
  </section>

  <!-- Results -->
  <section class="results">
    <div class="result-card">
      <div class="label">Mixer</div>
      <div class="value" id="out-mixer">—</div>
      <div class="unit" data-unit>oz</div>
    </div>
    <div class="result-card">
      <div class="label">Water</div>
      <div class="value" id="out-water">—</div>
      <div class="unit" data-unit>oz</div>
    </div>
    <div class="result-card">
      <div class="label">Liquor</div>
      <div class="value" id="out-liquor">—</div>
      <div class="unit" data-unit>oz</div>
    </div>
  </section>

  <section class="warnings" id="warnings" hidden></section>

  <!-- Form -->
  <main class="container">
    <form id="slush-form" novalidate>
      <div class="field">
        <label for="batch" id="lbl-batch">Batch size</label>
        <input id="batch" type="number" required />
      </div>
      <div class="row">
        <div class="field half">
          <label for="serving" id="lbl-serving">Label serving size</label>
          <input id="serving" type="number" required />
        </div>
        <div class="field half">
          <label for="sugar">Sugar per serving (g)</label>
          <input id="sugar" type="number" step="0.1" min="0" required />
        </div>
      </div>
      <div class="switch">
        <input id="hasLiquor" type="checkbox" />
        <label for="hasLiquor">Include liquor</label>
      </div>
      <div class="field" id="abv-field">
        <label for="abv">Liquor ABV (%)</label>
        <input id="abv" type="number" step="1" min="1" max="96" value="40" />
      </div>
      <div class="buttons">
        <button type="submit" class="cta">Calculate Slush</button>
        <button type="button" id="resetBtn" class="btn-secondary">Reset</button>
      </div>
    </form>
  </main>

  <script>
  /* === Math engine (always oz) === */
  (function(){
    const OZ_TO_ML=29.5735,RHO_WATER=1,RHO_MIXER=1,RHO_LIQUOR=0.95;
    const TARGET_ABV=7,TARGET_BRIX=11.8;
    const BMIN_ALC=11.5,BMAX_ALC=12.5,BMIN_NO=10.5,BMAX_NO=11.2;
    function rHalf(x){return Math.round(x*2)/2;}function rUpHalf(x){return Math.ceil(x*2)/2;}
    window.calculateSimpleLab=function(p){
      const batch=+p.batchOz||0, liquorABV=+p.liquorABV||0, servOz=+p.servingSizeOz||0, sugarG=+p.sugarPerServingG||0;
      const incl=p.includeLiquor;
      if(batch<=0||servOz<=0||sugarG<=0) return {mixerOz:0,waterOz:0,liquorOz:0,warnings:["Recipe Error — check inputs."],isValid:false};
      let L=0;if(incl&&liquorABV>0)L=Math.min(batch,(TARGET_ABV/100*batch)/(liquorABV/100));
      const sugarConc=sugarG/servOz;
      const massEst=((batch-L)*OZ_TO_ML*RHO_WATER)+(L*OZ_TO_ML*RHO_LIQUOR);
      const targetSugar=(TARGET_BRIX/100)*massEst; let M=targetSugar/sugarConc; M=Math.min(Math.max(M,0),batch-L);
      let W=rHalf(batch-(L+M)); if(W<0)W=0;
      const V=L+M+W,totMass=(L*OZ_TO_ML*RHO_LIQUOR)+(M*OZ_TO_ML*RHO_MIXER)+(W*OZ_TO_ML*RHO_WATER);
      const sugarMass=sugarConc*M;const finalBrix=totMass>0?(sugarMass/totMass)*100:0;
      const minB=incl?BMIN_ALC:BMIN_NO,maxB=incl?BMAX_ALC:BMAX_NO;
      if(finalBrix>maxB){const add=((finalBrix-maxB)/finalBrix)*V;const addR=rHalf(add);if(addR>0)W=rHalf(W+addR);}
      let sugarGuide=null;if(finalBrix<minB&&V>0){const def=minB-finalBrix,sNeed=(def/100)*totMass;
        if(sNeed>=0.5){const sugarTbsp=Math.ceil((sNeed/12.5)*2)/2;let waterOz=rUpHalf((sNeed/2)/OZ_TO_ML);sugarGuide={sugarTbsp,waterOz};}}
      return {mixerOz:M,waterOz:W,liquorOz:L,warnings:[],sugarGuide,isValid:true};
    };
  })();

  /* === UI === */
  (function(){
    const OZ_TO_ML=29.5735,$=s=>document.querySelector(s);
    const mEl=$("#out-mixer"),wEl=$("#out-water"),lEl=$("#out-liquor"),warnEl=$("#warnings");
    const form=$("#slush-form"),reset=$("#resetBtn");
    const hasL=$("#hasLiquor"),abvF=$("#abv-field"),abv=$("#abv");
    const ozBtn=$("#u-oz"),mlBtn=$("#u-ml"),unitEls=document.querySelectorAll("[data-unit]");
    const lblBatch=$("#lbl-batch"),lblServ=$("#lbl-serving"),inpBatch=$("#batch"),inpServ=$("#serving"),inpSugar=$("#sugar");
    const rangeNote=$("#rangeNote");

    // Batch constraints (canonical in oz)
    const BATCH_MIN_OZ=16,BATCH_MAX_OZ=96;
    const BATCH_MIN_ML=Math.round(BATCH_MIN_OZ*OZ_TO_ML); // 473
    const BATCH_MAX_ML=Math.round(BATCH_MAX_OZ*OZ_TO_ML); // 2840

    let unit=localStorage.getItem("unitPref")==="ml"?"ml":"oz";
    let last=null,lastRes=null;

    function toOzInput(v){return unit==="oz"?v:v/OZ_TO_ML;}
    function fromOz(v){return unit==="oz"?v:v*OZ_TO_ML;}
    function fmt1(x){if(!isFinite(x))return"—";const v=Math.round(x*10)/10;return Number.isInteger(v)?String(v):v.toFixed(1);}
    function clearResults(){mEl.textContent=wEl.textContent=lEl.textContent="—";last=null;}
    function pushWarn(msg){const d=document.createElement("div");d.className="item";d.textContent=msg;warnEl.appendChild(d);}
    function clearWarns(){warnEl.innerHTML="";warnEl.hidden=true;}
    function render(m,w,l){mEl.textContent=fmt1(fromOz(m));wEl.textContent=fmt1(fromOz(w));lEl.textContent=fmt1(fromOz(l));last={m,w,l};}
    function renderWarnings(){
      clearWarns(); if(!lastRes) return;
      if(lastRes.sugarGuide){
        const {sugarTbsp,waterOz}=lastRes.sugarGuide;
        if(unit==="ml"){
          const wMl=Math.round(waterOz*OZ_TO_ML);
          pushWarn(`Low sugar — dissolve ${fmt1(sugarTbsp)} Tbsp sugar in ${wMl} mL warm water, mix in, then recalc.`);
        } else {
          if(waterOz<1){const tsp=Math.max(1,Math.round(waterOz*6));pushWarn(`Low sugar — dissolve ${fmt1(sugarTbsp)} Tbsp sugar in ${tsp} tsp warm water, mix in, then recalc.`);}
          else pushWarn(`Low sugar — dissolve ${fmt1(sugarTbsp)} Tbsp sugar in ${fmt1(waterOz)} oz warm water, mix in, then recalc.`);
        }
        warnEl.hidden=false;
      }
    }

    function syncLiquor(){abvF.style.display=hasL.checked?"":"none";if(hasL.checked&&!abv.value)abv.value="40";}
    hasL.addEventListener("change",syncLiquor);

    function setInputStepsPlaceholdersAndRange(){
      if(unit==="oz"){
        inpBatch.step="0.5"; inpBatch.min=String(BATCH_MIN_OZ); inpBatch.max=String(BATCH_MAX_OZ); inpBatch.placeholder="e.g., 64";
        inpServ.step="0.1";  inpServ.min="0";                   inpServ.placeholder="e.g., 4";
        rangeNote.textContent="Batch size: 16–96 oz";
      } else {
        inpBatch.step="50";  inpBatch.min=String(BATCH_MIN_ML); inpBatch.max=String(BATCH_MAX_ML); inpBatch.placeholder="e.g., 2000";
        inpServ.step="5";    inpServ.min="0";                   inpServ.placeholder="e.g., 120";
        rangeNote.textContent="Batch size: 473–2840 mL";
      }
    }

    function resetFormValues(){
      form.reset(); syncLiquor(); clearResults(); lastRes=null; clearWarns();
    }

    function applyUnit(){
      // segmented state + aria
      if(unit==="oz"){ozBtn.classList.add("on");ozBtn.setAttribute("aria-selected","true");mlBtn.classList.remove("on");mlBtn.setAttribute("aria-selected","false");}
      else{mlBtn.classList.add("on");mlBtn.setAttribute("aria-selected","true");ozBtn.classList.remove("on");ozBtn.setAttribute("aria-selected","false");}
      unitEls.forEach(e=>e.textContent=unit);
      lblBatch.textContent="Batch size"; lblServ.textContent="Label serving size";
      setInputStepsPlaceholdersAndRange();
      resetFormValues();
      localStorage.setItem("unitPref",unit);
    }

    ozBtn.addEventListener("click",()=>{ if(unit!=="oz"){ unit="oz"; applyUnit(); }});
    mlBtn.addEventListener("click",()=>{ if(unit!=="ml"){ unit="ml"; applyUnit(); }});

    // init
    applyUnit();

    form.addEventListener("submit",e=>{
      e.preventDefault();
      clearWarns();

      const batchDisplay=+document.getElementById("batch").value||0;
      const servingDisplay=+document.getElementById("serving").value||0;

      // Convert displayed values → oz
      const batchOz=toOzInput(batchDisplay);
      const servingOz=toOzInput(servingDisplay);

      // Enforce batch range
      if(batchOz < 16 || batchOz > 96){
        pushWarn(unit==="oz" ? "Batch size must be between 16–96 oz." : "Batch size must be between 473–2840 mL.");
        warnEl.hidden=false; clearResults(); return;
      }

      const res=window.calculateSimpleLab({
        batchOz: batchOz,
        includeLiquor: document.getElementById("hasLiquor").checked,
        liquorABV: +document.getElementById("abv").value||0,
        servingSizeOz: servingOz,
        sugarPerServingG:+document.getElementById("sugar").value||0
      });

      lastRes=res;
      if(!res.isValid){ clearResults(); renderWarnings(); return; }
      render(res.mixerOz,res.waterOz,res.liquorOz);
      renderWarnings();
    });

    document.getElementById("resetBtn").addEventListener("click", resetFormValues);
  })();
  </script>
</body>
</html>
