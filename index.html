<script>
(function() {
  const form = document.getElementById("slush-form");
  const resetBtn = document.getElementById("resetBtn");
  const unitButtons = { oz: document.getElementById("u-oz"), ml: document.getElementById("u-ml") };
  const outputs = {
    mixer: document.getElementById("out-mixer"),
    water: document.getElementById("out-water"),
    liquor: document.getElementById("out-liquor"),
    units: document.querySelectorAll("[data-unit]")
  };
  const abvField = document.getElementById("abv-field");
  const warningsEl = document.getElementById("warnings");

  let unit = "oz"; // default

  // --- Unit toggle ---
  unitButtons.oz.addEventListener("click", () => setUnit("oz"));
  unitButtons.ml.addEventListener("click", () => setUnit("ml"));
  function setUnit(u) {
    unit = u;
    unitButtons.oz.classList.toggle("on", u === "oz");
    unitButtons.ml.classList.toggle("on", u === "ml");
    outputs.units.forEach(el => el.textContent = u);
  }

  // --- Liquor toggle ---
  document.getElementById("hasLiquor").addEventListener("change", e => {
    abvField.style.display = e.target.checked ? "block" : "none";
  });

  // --- Form submit ---
  form.addEventListener("submit", e => {
    e.preventDefault();
    calculate();
  });

  // --- Reset ---
  resetBtn.addEventListener("click", () => {
    form.reset();
    clearResults();
  });

  function clearResults() {
    [outputs.mixer, outputs.water, outputs.liquor].forEach(el => el.textContent = "—");
    warningsEl.hidden = true;
    warningsEl.innerHTML = "";
  }

  // --- Conversion helpers ---
  function toML(oz) { return oz * 29.5735; }
  function toOz(ml) { return ml / 29.5735; }
  function displayVal(val) {
    return unit === "oz" ? val.toFixed(1) : toML(val).toFixed(0);
  }

  // Round to nearest 0.5 oz
  function roundHalf(x) { return Math.round(x * 2) / 2; }

  // --- Main SimpleLAB math ---
  function calculate() {
    const batch = parseFloat(document.getElementById("batch").value);
    const serving = parseFloat(document.getElementById("serving").value);
    const sugar = parseFloat(document.getElementById("sugar").value);
    const hasLiquor = document.getElementById("hasLiquor").checked;
    const abv = parseFloat(document.getElementById("abv").value);

    if (!batch || !serving || !sugar) return;

    // Constants
    const targetBrix = 11.75;
    const targetABV = 7.0;

    // Sugar density (g/oz mixer)
    const sugarPerOz = sugar / serving;

    // If liquor, compute needed oz to reach ~7% ABV
    let liquorVol = 0;
    if (hasLiquor) {
      liquorVol = (batch * targetABV) / (abv || 40);
    }

    // Mixer: enough to hit sugar target
    const totalSugarTarget = batch * targetBrix * 29.5735 / 100; // g sugar
    let mixerVol = totalSugarTarget / sugarPerOz;

    // Prevent overshoot if liquor takes too much space
    if (mixerVol + liquorVol > batch) {
      mixerVol = batch - liquorVol;
    }

    // Water = remainder
    let waterVol = batch - mixerVol - liquorVol;

    // Round to 0.5 oz
    mixerVol = roundHalf(mixerVol);
    waterVol = roundHalf(waterVol);
    liquorVol = roundHalf(liquorVol);

    // --- Update outputs ---
    outputs.mixer.textContent = displayVal(mixerVol);
    outputs.water.textContent = displayVal(waterVol);
    outputs.liquor.textContent = displayVal(liquorVol);

    // --- Warnings ---
    warningsEl.innerHTML = "";
    if (waterVol < 0) addWarning("Not enough water space. Lower sugar or batch size.");
    if (mixerVol <= 0) addWarning("Mixer volume too low. Check sugar per serving.");
    if (hasLiquor && liquorVol <= 0) addWarning("Liquor volume too low to hit ABV.");
    warningsEl.hidden = warningsEl.innerHTML === "";
  }

  function addWarning(msg) {
    const item = document.createElement("div");
    item.className = "item";
    item.textContent = msg;
    warningsEl.appendChild(item);
  }

})();
</script>
