<body>
  <div class="container">
    <h1>🥶 SlushIQ SimpleLab</h1>
    <p>Make the perfect drink every time.</p>

    <form id="simplelab-form">
      <div class="field">
        <label>Batch Size (oz):</label>
        <input type="number" id="batchSize" value="16" step="0.1">
      </div>
      <div class="field">
        <label>Sugar (grams):</label>
        <input type="number" id="sugarGrams" value="21" step="0.1">
      </div>
      <div class="field">
        <label>Liquor ABV (%):</label>
        <input type="number" id="liquorABV" value="40" step="0.1">
      </div>
      <div class="field checkbox">
        <label>Include Liquor?</label>
        <input type="checkbox" id="hasLiquor">
      </div>
    </form>

    <hr>

    <div class="results">
      <div class="card">
        <h2 id="brix">0%</h2>
        <p>°Brix</p>
      </div>
      <div class="card">
        <h2 id="abv">0%</h2>
        <p>ABV</p>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const batchSize = parseFloat(document.getElementById('batchSize').value) || 0;
      const sugarGrams = parseFloat(document.getElementById('sugarGrams').value) || 0;
      const liquorABV = parseFloat(document.getElementById('liquorABV').value) || 0;
      const hasLiquor = document.getElementById('hasLiquor').checked;

      const ozToMl = 29.57;
      const rhoWater = 1.0;

      const totalVolumeMl = batchSize * ozToMl;
      const totalSugar = sugarGrams;

      const finalBrix = ((totalSugar / (totalVolumeMl * rhoWater)) * 100).toFixed(1);

      let finalABV = 0;
      if (hasLiquor) {
        // simplified: ABV dial logic can be expanded
        finalABV = ((batchSize * (liquorABV / 100)) / batchSize * 100).toFixed(1);
      }

      document.getElementById('brix').innerText = `${finalBrix}%`;
      document.getElementById('abv').innerText = `${finalABV}%`;
    }

    // recalc anytime inputs change
    document.querySelectorAll("input").forEach(input => {
      input.addEventListener("input", calculate);
    });

    calculate();
  </script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      background: #f5f7fa;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 2rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .field {
      display: flex;
      justify-content: space-between;
      margin: 0.8rem 0;
    }
    .field input {
      width: 120px;
      padding: 0.4rem;
    }
    .checkbox {
      align-items: center;
    }
    .results {
      display: flex;
      justify-content: space-around;
      margin-top: 2rem;
    }
    .card {
      background: #f9f9f9;
      padding: 1rem 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      text-align: center;
      width: 40%;
    }
    .card h2 {
      margin: 0;
      color: #4a90e2;
    }
  </style>
</body>
