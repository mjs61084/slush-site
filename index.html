<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlushIQ SimpleLab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🥶 SlushIQ SimpleLab</h1>
    <p class="tagline">Make the perfect drink every time.</p>

    <form id="simplelab-form" onsubmit="return false;">
      <!-- Batch size -->
      <div class="field">
        <label for="batchSize">Batch Size:</label>
        <input type="number" id="batchSize" value="16" step="0.1">
      </div>

      <!-- Units -->
      <div class="field">
        <label for="unitSelect">Units:</label>
        <select id="unitSelect">
          <option value="oz" selected>Ounces (oz)</option>
          <option value="ml">Milliliters (mL)</option>
        </select>
      </div>

      <!-- Sugar -->
      <div class="field">
        <label for="sugarGrams">Sugar (g per serving):</label>
        <input type="number" id="sugarGrams" value="21" step="0.1">
      </div>

      <!-- Liquor ABV -->
      <div class="field">
        <label for="liquorABV">Liquor ABV (%):</label>
        <input type="number" id="liquorABV" value="40" step="0.1">
      </div>

      <!-- Liquor toggle -->
      <div class="field checkbox">
        <label for="hasLiquor">Include Liquor?</label>
        <input type="checkbox" id="hasLiquor">
      </div>

      <!-- Reset button -->
      <div class="actions">
        <button type="button" id="resetBtn">Reset</button>
      </div>
    </form>

    <hr>

    <!-- Results -->
    <div class="results">
      <div class="card">
        <h2 id="mixerOut">0</h2>
        <p>Mixer</p>
      </div>
      <div class="card">
        <h2 id="waterOut">0</h2>
        <p>Water</p>
      </div>
      <div class="card" id="liquorCard" style="display:none;">
        <h2 id="liquorOut">0</h2>
        <p>Liquor</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
